name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly regression, including a canary run against the live demo API
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  api-tests:
    name: API tests (hermetic)
    runs-on: ubuntu-latest
    needs: lint
    # Runs against a restful-booker container on the runner itself, so
    # results are deterministic and never depend on the public demo
    # server being up or clean
    services:
      restful-booker:
        image: mwinteringham/restfulbooker:latest
        ports:
          - 3001:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3001/ping; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time" >&2
          exit 1

      - name: Run Cypress API tests
        uses: cypress-io/github-action@v6
        with:
          browser: electron
        env:
          CYPRESS_BASE_URL: http://localhost:3001

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report
          path: cypress/reports
          retention-days: 30

      - name: Upload report as Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: cypress/reports

  api-tests-live:
    name: API tests (live demo API)
    runs-on: ubuntu-latest
    needs: lint
    # Nightly canary against the public instance; not a PR gate, so a
    # Heroku outage can never block a merge
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Run Cypress API tests against live API
        uses: cypress-io/github-action@v6
        with:
          browser: electron

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report-live
          path: cypress/reports
          retention-days: 30

  publish-report:
    name: Publish report to GitHub Pages
    runs-on: ubuntu-latest
    needs: api-tests
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
